[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-geollm-reproduction"
version = "0.2.0"
description = "Modular reproduction scaffold for CARE GeoLLM"
requires-python = ">=3.10"
dependencies = ["torch>=2.2","numpy>=1.24","scikit-learn>=1.3","scipy>=1.10","pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["care_geollm*"]
